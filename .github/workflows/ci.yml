name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NG_CLI_ANALYTICS: false

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build --no-restore --configuration Release

      # Integration tests start a PostgreSQL 18 container via Testcontainers (Docker is preinstalled on the runner).
      - name: Test
        run: dotnet test --no-build --configuration Release

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:ci

      - name: Build
        run: pnpm build

  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Building the API rewrites api/openapi/hilom-api.json.
      - name: Build API
        run: dotnet build api/src/Hilom.Api --configuration Release

      - name: Regenerate API client
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm api:generate

      - name: Fail if the committed contract or client is out of date
        run: |
          if ! git diff --exit-code -- api/openapi web/src/app/api; then
            echo "::error::The OpenAPI document or generated client changed. Build the API, run 'pnpm api:generate' in web/, and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- api/openapi web/src/app/api)" ]; then
            git status --porcelain -- api/openapi web/src/app/api
            echo "::error::New generated files are not committed. Run 'pnpm api:generate' in web/ and commit the result."
            exit 1
          fi

  e2e:
    name: E2E
    # Pinned: on ubuntu-latest (26.04) the Chromium system packages couldn't be fetched (apt mirrors didn't resolve).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Real API and database: Playwright starts the API in Development mode, which migrates and seeds the admin.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hilom
          POSTGRES_USER: hilom
          POSTGRES_PASSWORD: hilom_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hilom -d hilom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Catches the invite emails; the invite test reads them through Mailpit's API.
      mail:
        image: axllent/mailpit:v1.33
        ports:
          - 1025:1025
          - 8025:8025
    env:
      ConnectionStrings__Hilom: Host=localhost;Port=5432;Database=hilom;Username=hilom;Password=hilom_ci
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build API
        run: dotnet build ../api/src/Hilom.Api

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Light and dark runs, with axe accessibility checks on every page.
      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
