<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hilom</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Hilom at Aruga: healing and care, in one hospital system." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved or system theme before first paint, so dark mode never flashes light.
      (function () {
        try {
          var saved = localStorage.getItem('hilom-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = saved === 'dark' || ((saved === null || saved === 'system') && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
